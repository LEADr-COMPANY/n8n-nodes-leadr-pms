name: Publish to npm

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-publish
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'LEADr-COMPANY/n8n-nodes-leadr-pms' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Select unpublished version
        id: release
        run: node scripts/prepare-release.cjs
      - name: Set package and lockfile version
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm version "$RELEASE_VERSION" --no-git-tag-version --ignore-scripts --allow-same-version
          npm pkg set "gitHead=$GITHUB_SHA"
      - name: Build and test
        run: npm test
      - name: Prepare package
        if: steps.release.outputs.publish == 'true'
        run: npm pack
      - name: Verify n8n installation and update
        if: steps.release.outputs.publish == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm run test:install -- "n8n-nodes-leadr-pms-${RELEASE_VERSION}.tgz"
      - name: Publish using npm trusted publishing
        if: steps.release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: npm publish "n8n-nodes-leadr-pms-${RELEASE_VERSION}.tgz" --access public
      - name: Wait for npm validation
        if: steps.release.outputs.publish == 'true' && vars.NPM_PUBLISH_ENABLED == 'true'
        run: node scripts/wait-for-release.cjs
      - name: Record result
        env:
          PUBLISH_ENABLED: ${{ vars.NPM_PUBLISH_ENABLED }}
          SHOULD_PUBLISH: ${{ steps.release.outputs.publish }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ "$SHOULD_PUBLISH" != "true" ]; then
            echo "Commit already published or superseded by ${RELEASE_VERSION}." >> "$GITHUB_STEP_SUMMARY"
          elif [ "$PUBLISH_ENABLED" = "true" ]; then
            echo "Published n8n-nodes-leadr-pms@${RELEASE_VERSION} to npm." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Tests and package preparation passed. Publishing awaits npm Trusted Publisher setup and the NPM_PUBLISH_ENABLED=true repository variable." >> "$GITHUB_STEP_SUMMARY"
          fi
